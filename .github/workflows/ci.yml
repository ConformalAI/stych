name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . --output-format=concise
      - name: Format check (black)
        run: black --check --line-length 100 . --exclude '/(\.venv|migrations|alembic/versions)/'
      - name: Tests
        run: pytest -q --ignore=tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 9999
      - name: Format check
        run: npm run format:check
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    env:
      # Throwaway values so the compose file validates and builds; nothing is started.
      POSTGRES_PASSWORD: ci
      SUPERTOKENS_DB_PASSWORD: ci
      SUPERTOKENS_API_KEY: ci-supertokens-api-key-0000
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret
      LITELLM_MASTER_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build backend frontend
